name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: build --release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/ollama-proxy

      - name: tar.gz archive
        run: |
          mkdir -p dist
          tar -czf dist/ollama-proxy-x86_64-unknown-linux-gnu.tar.gz -C target/x86_64-unknown-linux-gnu/release ollama-proxy

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ollama-proxy-x86_64-unknown-linux-gnu.tar.gz
